<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfinitAgent — UI Redesign</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tokens -->
  <link rel="stylesheet" href="tokens.css" />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Lucide UMD -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
  <script>
    // Wrap lucide UMD: exposes each icon directly as window.lucide.IconName =
    // [tag, attrs, children]. We replace window.lucide with a Proxy that
    // returns a React component for any icon name on access.
    (function () {
      if (!window.lucide) {
        console.warn('[lucide] global not loaded');
        return;
      }
      const real = window.lucide;
      const cache = {};
      const buildIcon = (data, name) => {
        // data shape can be [tag, attrs, children] OR { iconNode, ... }.
        let children;
        if (Array.isArray(data) && data.length >= 3) {
          children = data[2];
        } else if (data && Array.isArray(data.iconNode)) {
          children = data.iconNode;
        } else if (Array.isArray(data) && data.length === 1 && Array.isArray(data[0])) {
          children = data[0];
        } else {
          return null;
        }
        return function Icon(props) {
          const { size = 16, strokeWidth = 1.5, color, style, ...rest } = props || {};
          return React.createElement('svg', Object.assign({
            xmlns: 'http://www.w3.org/2000/svg',
            width: size, height: size, viewBox: '0 0 24 24',
            fill: 'none', stroke: color || 'currentColor', strokeWidth,
            strokeLinecap: 'round', strokeLinejoin: 'round',
            'aria-hidden': 'true',
            style: Object.assign({ display: 'inline-block', flex: '0 0 auto', verticalAlign: 'middle' }, style || {}),
          }, rest), children.map((k, i) => {
            const [t, a] = k;
            return React.createElement(t, Object.assign({ key: i }, a));
          }));
        };
      };
      // missing-icon fallback: small dot, doesn't crash
      const fallback = function Icon(props) {
        const { size = 16, color, style } = props || {};
        return React.createElement('span', {
          style: Object.assign({
            display: 'inline-block', width: size, height: size,
            verticalAlign: 'middle',
            border: `1px dashed ${color || 'currentColor'}`,
            borderRadius: 3, opacity: 0.4,
          }, style || {}),
        });
      };
      window.lucide = new Proxy({}, {
        get(_, name) {
          if (typeof name !== 'string') return undefined;
          if (cache[name]) return cache[name];
          const data = real[name];
          const cmp = data ? buildIcon(data, name) : null;
          cache[name] = cmp || fallback;
          if (!cmp && !window.__lucideMissing) window.__lucideMissing = new Set();
          if (!cmp) window.__lucideMissing.add(name);
          return cache[name];
        },
        has() { return true; },
      });
    })();
  </script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="atoms.jsx"></script>
  <script type="text/babel" src="system.jsx"></script>
  <script type="text/babel" src="sidepanel.jsx"></script>
  <script type="text/babel" src="options.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const { SidePanel, OptionsPage, DesignSystemShowcase } = window;

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="system" title="01 · Design system" subtitle="Tokens, type, atomic components — light & dark">
            <DCArtboard id="ds-light" label="Tokens · light" width={1080} height={1500}>
              <DesignSystemShowcase theme="infinit" />
            </DCArtboard>
            <DCArtboard id="ds-dark"  label="Tokens · dark"  width={1080} height={1500}>
              <DesignSystemShowcase theme="infinit-dark" />
            </DCArtboard>
          </DCSection>

          <DCSection id="sidepanel" title="02 · Side Panel" subtitle="400px · Chrome side panel · 3 stati">
            <DCArtboard id="sp-main"  label="A · Main · streaming"  width={400} height={720}>
              <SidePanel theme="infinit" />
            </DCArtboard>
            <DCArtboard id="sp-dark"  label="B · Main · dark"       width={400} height={720}>
              <SidePanel theme="infinit-dark" />
            </DCArtboard>
            <DCArtboard id="sp-approve" label="C · Approval modal"  width={400} height={720}>
              <SidePanel theme="infinit" variant="approval" />
            </DCArtboard>
            <DCArtboard id="sp-empty" label="D · No provider"       width={400} height={720}>
              <SidePanel theme="infinit" variant="no-provider" />
            </DCArtboard>
          </DCSection>

          <DCSection id="options" title="03 · Options page" subtitle="1080px · 5 tabs · sidebar verticale">
            <DCArtboard id="opt-general"   label="A · Generale"          width={1080} height={720}>
              <OptionsPage theme="infinit" initialTab="general" />
            </DCArtboard>
            <DCArtboard id="opt-providers" label="B · Configurazione LLM" width={1080} height={720}>
              <OptionsPage theme="infinit" initialTab="providers" />
            </DCArtboard>
            <DCArtboard id="opt-memory"    label="C · Memoria"           width={1080} height={720}>
              <OptionsPage theme="infinit" initialTab="memory" />
            </DCArtboard>
            <DCArtboard id="opt-skills"    label="D · Skill"             width={1080} height={720}>
              <OptionsPage theme="infinit" initialTab="skills" />
            </DCArtboard>
            <DCArtboard id="opt-profiles"  label="E · Profili dominio"   width={1080} height={720}>
              <OptionsPage theme="infinit" initialTab="profiles" />
            </DCArtboard>
            <DCArtboard id="opt-providers-dark" label="F · LLM · dark"   width={1080} height={720}>
              <OptionsPage theme="infinit-dark" initialTab="providers" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
